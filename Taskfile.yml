# yaml-language-server: $schema=https://taskfile.dev/schema.json
---
version: "3"

set:
  - pipefail

silent: true

tasks:
  default:
    desc: Show help
    silent: true
    cmds:
      - task --list --color

  sync:
    desc: Sync python environment from uv.lock
    preconditions:
      - sh: command -v uv
        msg: "uv is not installed, see https://docs.astral.sh/uv/getting-started/installation/"
      - test -f uv.lock
    cmds:
      - uv sync

  lock:
    desc: Refresh uv.lock with the latest allowed versions
    preconditions:
      - sh: command -v uv
        msg: "uv is not installed, see https://docs.astral.sh/uv/getting-started/installation/"
    cmds:
      - uv lock --upgrade

  anslint:
    desc: Run ansible-lint
    deps:
      - sync
    cmds:
      - uv run ansible-lint --force-color .

  ymllint:
    desc: Run yamllint
    deps:
      - sync
    cmds:
      - uv run yamllint --format auto --strict .

  lint:
    desc: Run all linters
    cmds:
      - task: ymllint
      - task: anslint

  test:
    desc: Run test for this role
    deps:
      - lint
    cmds:
      - echo "Oooops... Need to implement!"
